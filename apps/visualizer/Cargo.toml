[package]
name = "unrust-it-visualizer"
description = "Interactive 3D multi-arm trajectory, collision sphere, signed-distance witness, and MPPI rollout visualizer for unrust-it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["gui"]
render = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
gui = [
    "render",
    "dep:slint",
    "dep:slint-build",
    "dep:rfd",
    "slint/backend-winit",
    "slint/renderer-femtovg-wgpu",
    "slint/unstable-wgpu-30",
]
gui-readback = [
    "render",
    "dep:slint",
    "dep:slint-build",
    "dep:rfd",
    "slint/backend-winit",
    "slint/renderer-femtovg",
]
gpu-compute = ["unrust-it/gpu"]

[dependencies]
bytemuck = { workspace = true, optional = true }
log.workspace = true
nalgebra.workspace = true
parry3d.workspace = true
pollster = { workspace = true, optional = true }
rayon.workspace = true
rfd = { version = "0.18", optional = true }
slint = { version = "~1.19", default-features = false, features = ["std", "compat-1-2"], optional = true }
thiserror.workspace = true
unrust-it.workspace = true
unrust-it-urdf = { path = "../../crates/unrust-it-urdf" }
wgpu = { workspace = true, optional = true }

[build-dependencies]
slint-build = { version = "~1.19", optional = true }
