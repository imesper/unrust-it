[package]
name = "unrust-it-visualizer"
description = "Interactive 3D multi-arm trajectory, collision sphere, signed-distance witness, and MPPI rollout visualizer for unrust-it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gui"]
render = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
gui = [
    "render",
    "dep:eframe",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui_plot",
    "dep:rfd",
]
gpu-compute = ["unrust-it/gpu"]

[dependencies]
bytemuck = { workspace = true, optional = true }
eframe = { version = "0.37", optional = true }
egui = { version = "0.37", optional = true }
egui-wgpu = { version = "0.37", optional = true }
egui_plot = { version = "0.38", optional = true }
log.workspace = true
nalgebra.workspace = true
parry3d.workspace = true
pollster = { workspace = true, optional = true }
rayon.workspace = true
rfd = { version = "0.18", optional = true }
thiserror.workspace = true
unrust-it.workspace = true
unrust-it-io.workspace = true
unrust-it-urdf = { path = "../../crates/unrust-it-urdf" }
wgpu = { workspace = true, optional = true }
